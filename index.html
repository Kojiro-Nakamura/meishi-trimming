<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- ホーム画面追加時のネイティブアプリ化（フルスクリーン表示）設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="名刺スキャナ">
    <link rel="manifest" href="manifest.json">
    <!-- キャッシュ対策 (Service Worker導入に伴い、通常のブラウザキャッシュ設定は不要になりますが念のため残します) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>名刺トリミング</title>
    <link rel="stylesheet" href="style.css?v=1.0.11">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>名刺スキャナ <span style="font-size: 12px; color: #8e8e93; font-weight: normal;">ver 1.0.11</span></h1>
        </header>
        
        <main>
            <!-- 初期状態の画面 -->
            <div id="initial-view" class="view active">
                <label for="image-input" class="btn primary-btn">
                    写真を撮る / 選ぶ
                </label>
                <input type="file" id="image-input" accept="image/*" capture="environment">
                <p class="instruction">名刺を撮影してください</p>
            </div>

            <!-- 編集状態の画面 -->
            <div id="editor-view" class="view">
                <div id="debug-status" style="position: absolute; top: 60px; left: 10px; right: 10px; color: #ffeb3b; font-size: 12px; z-index: 100; text-align: center; text-shadow: 1px 1px 2px black; pointer-events: none;"></div>
                <div class="editor-container" id="editor-container">
                    <canvas id="editor-canvas"></canvas>
                </div>
                
                <div class="controls">
                    <div class="action-buttons">
                        <button id="rotate-left" class="btn secondary-btn">↺ 左へ回転</button>
                        <button id="rotate-right" class="btn secondary-btn">↻ 右へ回転</button>
                    </div>
                    <button id="save-btn" class="btn primary-btn">補正して完了</button>
                    <button id="cancel-btn" class="btn text-btn">キャンセル</button>
                </div>
            </div>

            <!-- 結果・保存画面 -->
            <div id="result-view" class="view">
                <div class="result-container">
                    <img id="cropped-result" src="" alt="Cropped Result">
                </div>
                <div class="controls">
                    <p class="instruction" style="margin-bottom: 12px; font-weight: bold; color: #ff3b30;">
                        ↓ 画像を長押しして「写真に追加」または「保存」を選択してください
                    </p>
                    <button id="download-btn" class="btn primary-btn">ファイルとして保存 (PC/Android)</button>
                    <button id="back-to-edit-btn" class="btn secondary-btn">編集に戻る</button>
                    <button id="start-over-btn" class="btn text-btn">最初からやり直す</button>
                </div>
            </div>
        </main>
    </div>

    <!-- 軽量化のためOpenCVへの依存を完全に排除し、PureJSで実装 -->
    <script src="app.js?v=1.0.11"></script>
    <script>
        // 完全オフライン動作のための Service Worker 登録
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(error => {
                        console.log('ServiceWorker registration failed: ', error);
                    });
            });
        }
    </script>
</body>
</html>
